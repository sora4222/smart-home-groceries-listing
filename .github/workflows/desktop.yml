# Tauri desktop client: rustfmt, clippy, cargo check and tests on macOS.
# macOS runners cost the most, so this runs only when desktop files change.
name: Desktop

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  native:
    name: native macOS checks
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'desktop')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: make check-desktop test-desktop
