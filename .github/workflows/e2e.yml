# Playwright end-to-end tests against the real backend and a real database.
# Fake store clients and the keyword triage checker keep it off the internet.
# On a pull request each job runs only when its files change (.github/filters.yml).
name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  playwright:
    name: playwright
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install test tooling
        run: pnpm install --frozen-lockfile
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # The browser download is keyed on the installed Playwright version.
      # The system libraries still come from apt on every run.
      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: Playwright
        run: make test-frontend-playwright

      - name: Server logs
        if: failure()
        run: find "${TMPDIR:-/tmp}" -maxdepth 2 -path '*/grocery-e2e-*/*.log' -exec tail -n 100 {} +
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
