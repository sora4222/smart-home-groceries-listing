# The repo's own tooling: tests for the scripts the Makefile and CI rely on
# (`make test-tooling`), shellcheck on those scripts, actionlint on these
# workflows, and a parse of docker-compose.yml.
name: Tooling

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: for test in scripts/*.test.sh; do sh "$test"; done

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from actionlint-py actionlint

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compose needs a .env to read; the example has every key.
      - run: cp .env.example .env && docker compose config --quiet
