# gitleaks settings for the Secret scan workflow: the default rules, minus
# test fixtures, which hold throwaway keys made only for tests.
[extend]
useDefault = true

[[allowlists]]
description = "Test-only keys and fixtures"
paths = ['''^backend/tests/fixtures/''']

[[allowlists]]
description = "The throwaway encryption key the tests and e2e runs use: the bytes 0 to 31, base64"
regexes = ['''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=''']
