# Runtime bundles contain no site configuration. Install/update tests run on disposable VMs.
name: Native service install and release
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['release-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-service-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.28.0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config perl python3
      - name: Test configuration and runtime bundle boundaries
        run: |
          node --test deploy/service/service.test.mjs scripts/service-env.test.mjs scripts/op-environment.test.mjs
          sh scripts/grocery-env.test.sh
          pnpm --dir frontend install --frozen-lockfile --silent
          pnpm --dir frontend exec vitest run src/lib/public-config.test.ts
      - name: Build without production configuration or 1Password
        env:
          GROCERY_ENV_FILE: /dev/null
        run: |
          make build-backend build-frontend build-alexa
          bash deploy/build.sh --assemble
          node deploy/service/package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-runtime
          path: build/grocery-linux-x64.json.gz
          if-no-files-found: error
          retention-days: 7
  installation:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [file, env, op-file, op-env]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-runtime
          path: build
      - name: Install OS runtime and PostgreSQL
        run: sudo bash deploy/service/install-dependencies.sh
      - name: Exercise real systemd, migrations, preservation and restore
        env:
          CONFIGURATION_MODE: ${{ matrix.configuration }}
        run: sudo env GROCERY_DISPOSABLE_TEST=1 node deploy/service/integration-test.mjs build/grocery-linux-x64.json.gz "$CONFIGURATION_MODE"
  publish:
    needs: [build, installation]
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-runtime
          path: build
      - name: Select publication; stable releases must belong to main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          ref = os.environ['SOURCE_REF']
          sha = os.environ['GITHUB_SHA']
          if ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
              if not re.fullmatch(r'release-[0-9]+\.[0-9]+\.[0-9]+', tag):
                  raise SystemExit('Invalid release tag')
              comparison = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/compare/' + sha + '...main']))
              if comparison['status'] not in ('ahead', 'identical'):
                  raise SystemExit('Release is not on main')
              prerelease = 'false'
          else:
              tag, prerelease = 'preview-' + sha, 'true'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PUBLISH_TAG=' + tag + '\nPRERELEASE=' + prerelease + '\n')
          PY
      - name: Attest tested runtime bytes
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/grocery-linux-x64.json.gz
      - name: Publish immutable runtime and verification bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" build/grocery-linux-x64.sigstore.json
          gh release create "$PUBLISH_TAG" --target "$GITHUB_SHA" --verify-tag=false --prerelease="$PRERELEASE" \
            --title "$PUBLISH_TAG" --notes 'Tested native runtime bundle. Configure secrets locally at service startup.' \
            build/grocery-linux-x64.json.gz build/grocery-linux-x64.sigstore.json
