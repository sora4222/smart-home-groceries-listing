# Applies to every grocery-*.service (systemd prefix drop-in).
#
# Each service runs as a throwaway user systemd creates at start, with no
# login, no home, no sudo and no capabilities, on a read-only view of the
# system. Configuration arrives from /run/grocery-secrets, which only root
# can read; the 1Password token never enters the service.
[Unit]
PartOf=grocery.target
# Keep retrying a failed start (1Password or the network not yet reachable
# at boot) instead of giving up after a few attempts.
StartLimitIntervalSec=0

[Service]
# Type=exec: start-up waits until the program is running, so the resolved
# configuration file is read before ExecStartPost deletes it.
Type=exec
Restart=on-failure
RestartSec=15
DynamicUser=yes
UMask=0077

# The components load .env themselves when one is nearby; here the resolved
# values are already in the environment.
Environment=GROCERY_ENV_FILE=/dev/null

CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateUsers=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
