# GitHub's code scanning for security bugs in every language in the repo.
# Results show in the repository's Security tab. On a pull request each
# language is scanned only when its files change; the matrix legs always
# report, so their check names stay the same when a scan is skipped.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7
      - id: changes
        uses: ./.github/actions/changes
      - if: contains(fromJSON(steps.changes.outputs.changes), format('codeql-{0}', matrix.language))
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - if: contains(fromJSON(steps.changes.outputs.changes), format('codeql-{0}', matrix.language))
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
