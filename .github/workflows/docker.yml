# Builds the images Compose runs, so a broken Dockerfile shows up on the
# pull request rather than on the home server. Nothing is pushed anywhere.
# Each image builds only when its files change; the matrix legs always
# report, so their check names stay the same when a build is skipped.
name: Docker

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: alexa-bridge
            context: sidecars/alexa-bridge
    steps:
      - uses: actions/checkout@v7
      - id: changes
        uses: ./.github/actions/changes
      - if: contains(fromJSON(steps.changes.outputs.changes), format('docker-{0}', matrix.image))
        uses: docker/setup-buildx-action@v4
      - if: contains(fromJSON(steps.changes.outputs.changes), format('docker-{0}', matrix.image))
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
