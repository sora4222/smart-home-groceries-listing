services:
  # Development database. Runs only when `db` is in COMPOSE_PROFILES (it is in
  # .env.example). A server with its own PostgreSQL drops `db` from the
  # profiles and points DATABASE_URL at host.docker.internal:5432 instead —
  # docs/human-setup.md, "Optional: PostgreSQL installed on the server".
  db:
    image: postgres:16
    profiles: ["db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Host port is POSTGRES_PORT (default 5432) so it can move off a port
    # another Postgres already uses. Inside the network it is always 5432.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grocery}"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      # Waits for the Docker database when the `db` profile runs it; without
      # the profile there is nothing to wait for and the backend starts alone.
      db:
        condition: service_healthy
        required: false
    # The startup loader resolves references before Compose interpolates these.
    # Never pass a raw .env or 1Password authentication token into a container.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET:-}
      ALEXA_BRIDGE_SECRET: ${ALEXA_BRIDGE_SECRET:-}
      STORE_TAB_SECRET: ${STORE_TAB_SECRET:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      STORE_CLIENTS: ${STORE_CLIENTS:-live}
      WOOLWORTHS_BASE_URL: ${WOOLWORTHS_BASE_URL:-}
      COLES_BASE_URL: ${COLES_BASE_URL:-}
      STORE_TIMEOUT_SECONDS: ${STORE_TIMEOUT_SECONDS:-12}
      STORE_SEARCH_CACHE_SECONDS: ${STORE_SEARCH_CACHE_SECONDS:-600}
      INTAKE_LLM_PROVIDER: ${INTAKE_LLM_PROVIDER:-ollama}
      INTAKE_LLM_BASE_URL: ${INTAKE_LLM_BASE_URL:-}
      INTAKE_LLM_MODEL: ${INTAKE_LLM_MODEL:-}
      INTAKE_LLM_API_KEY: ${INTAKE_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INTAKE_LLM_MIN_CONFIDENCE: ${INTAKE_LLM_MIN_CONFIDENCE:-0.7}
      INTAKE_LLM_TIMEOUT_SECONDS: ${INTAKE_LLM_TIMEOUT_SECONDS:-60}
      GOOGLE_TASKS_CLIENT: ${GOOGLE_TASKS_CLIENT:-live}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/settings/intake}
      GOOGLE_OAUTH_AUTH_URL: ${GOOGLE_OAUTH_AUTH_URL:-}
      GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-}
      GOOGLE_TASKS_API_BASE: ${GOOGLE_TASKS_API_BASE:-}
      GOOGLE_TIMEOUT_SECONDS: ${GOOGLE_TIMEOUT_SECONDS:-15}
      GOOGLE_TASKS_NO_BACKGROUND_POLL: ${GOOGLE_TASKS_NO_BACKGROUND_POLL:-false}
      RUST_LOG: ${RUST_LOG:-grocery_backend=info,tower_http=info,warn}
      BIND_ADDRESS: 0.0.0.0:8000
      # Daily access-log files (docs/features/FEATURE_ACCESS_LOGS.md), kept
      # in the access_logs volume so they survive a rebuild.
      ACCESS_LOG_DIR: /var/log/grocery
    volumes:
      - access_logs:/var/log/grocery
    # Deliberately NOT published to the host. The backend is reachable only
    # from this network — the Cloudflare Tunnel exposes the Alexa bridge and
    # the generic webhook path, never the whole API.
    expose:
      - "8000"
    # Lets the backend reach services running on the home server itself:
    # PostgreSQL (DATABASE_URL=…@host.docker.internal:5432/grocery) and an
    # Ollama outside Docker (http://host.docker.internal:11434/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "grocery-backend --health-check || exit 1"]
      interval: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  alexa-bridge:
    build: ./sidecars/alexa-bridge
    depends_on:
      - backend
    environment:
      ALEXA_SKILL_ID: ${ALEXA_SKILL_ID}
      ALEXA_BRIDGE_SECRET: ${ALEXA_BRIDGE_SECRET}
      BACKEND_BASE_URL: http://backend:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8081"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

  # Local model servers for LLM triage (docs/features/FEATURE_TRIAGE.md).
  # Each is off unless named in COMPOSE_PROFILES in .env, e.g.
  # COMPOSE_PROFILES=ollama. Point INTAKE_LLM_BASE_URL at the one you start.
  # None is published to the host or the tunnel: only the backend reaches it.

  # INTAKE_LLM_BASE_URL=http://ollama:11434/v1
  # Download the model once: docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped

  # INTAKE_LLM_BASE_URL=http://llamacpp:8080/v1
  # Downloads LLAMACPP_HF_MODEL from Hugging Face on first start, then reuses it.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llamacpp"]
    command:
      - "-hf"
      - "${LLAMACPP_HF_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llamacpp_models:/models
    expose:
      - "8080"
    restart: unless-stopped

  # INTAKE_LLM_BASE_URL=http://vllm:8000/v1 — needs an NVIDIA GPU and the
  # NVIDIA Container Toolkit. Serves INTAKE_LLM_MODEL (a Hugging Face name).
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    command:
      - "--model"
      - "${INTAKE_LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"
    ipc: host
    volumes:
      - vllm_models:/root/.cache/huggingface
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pg_data:
  access_logs:
  ollama_models:
  llamacpp_models:
  vllm_models:
