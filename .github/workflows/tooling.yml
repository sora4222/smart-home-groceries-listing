# The repo's own tooling: tests for the scripts the Makefile and CI rely on
# (`make test-tooling`), shellcheck on those scripts, actionlint on these
# workflows, and a parse of docker-compose.yml.
name: Tooling

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile
      - run: for test in scripts/*.test.sh; do sh "$test"; done

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh deploy/*.sh deploy/bin/grocery-env

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from actionlint-py actionlint

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compose needs a .env to read; the example has every key.
      - run: cp .env.example .env && docker compose config --quiet
      # Developers get the Docker database from the example's COMPOSE_PROFILES.
      - run: docker compose config --services | grep -qx db
      # A server with PostgreSQL installed drops the `db` profile; the backend's
      # optional depends_on must still parse without it.
      - run: COMPOSE_PROFILES=ollama docker compose config --quiet
