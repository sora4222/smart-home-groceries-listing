[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "curl-cffi>=0.16.3",
    "fastapi>=0.141.1",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default is the documented pattern
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
