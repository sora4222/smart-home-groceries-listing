# Rust backend: format, lint, tests and a dependency audit.
# The same checks a contributor runs with `make lint` and `make test-backend`.
# On a pull request each job runs only when its files change (.github/filters.yml).
name: Backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  fmt:
    name: rustfmt
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: pnpm install --frozen-lockfile && make test-backend
        working-directory: .

  audit:
    name: cargo audit
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
