[project]
name = "alexa-bridge"
version = "0.1.0"
description = "Verifies Alexa skill requests with Amazon's ask-sdk and forwards items to the Rust backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Amazon's official Alexa Skills Kit SDK. There is no maintained Rust
    # equivalent, which is the whole reason this sidecar exists.
    "ask-sdk-core>=1.19.0",
    "ask-sdk-webservice-support>=1.3.3",
    "flask-ask-sdk>=1.0.0",
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "requests>=2.32.0",
    # ask-sdk-webservice-support pulls in certvalidator -> oscrypto, and
    # oscrypto 1.3.0 (the newest release, 2022) cannot detect OpenSSL 3's
    # version and raises LibraryNotFoundError on import. The fix is on
    # oscrypto's master but unreleased, so it is pinned to an exact commit
    # for reproducibility. Drop this line once oscrypto > 1.3.0 is published.
    "oscrypto @ git+https://github.com/wbond/oscrypto.git@76bfdcb7285d856c44f8d0fbafe0ecca1c6d2f8b",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexa_bridge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
