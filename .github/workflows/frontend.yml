# Web app: Biome (format + lint + import order), TypeScript, unit tests and
# a production build. The dependency audit is in audit.yml.
# On a pull request each job runs only when its files change (.github/filters.yml).
name: Frontend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  check:
    name: biome, typecheck, test, build
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Biome (format, lint, imports)
        run: pnpm exec biome ci .
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test:run
      - name: Build
        run: pnpm build
