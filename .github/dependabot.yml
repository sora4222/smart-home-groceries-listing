# Weekly pull requests that keep dependencies current. Minor and patch
# updates are grouped into one PR per ecosystem so they are quick to review.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /sidecars/alexa-bridge
    schedule:
      interval: weekly
    groups:
      alexa-bridge-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /sidecars/alexa-bridge
    schedule:
      interval: weekly
